
<!DOCTYPE html>
<html lang="es">

<head>
    <!-- Configuración básica -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título de la aplicación -->
    <title>Bolivar Eco Calculator</title>

    <!-- Estilos CSS -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f1f7f2;
            color: #24352a;
            min-height: 100vh;
        }

        header {
            background-color: #176b45;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            font-size: 30px;
        }

        main {
            max-width: 900px;
            margin: 40px auto;
            padding: 30px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        main h2 {
            color: #176b45;
            margin-bottom: 15px;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #647568;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <!-- Encabezado -->
    <header>
        <h1>Bolivar Eco Calculator</h1>
        <p>Calculadora de sostenibilidad ambiental</p>
    </header>

    <!-- Contenido principal -->
    <main>
        <h2>Welcome to Bolivar Eco Calculator</h2>

        <p>
            Esta aplicación permite calcular y analizar
            indicadores relacionados con la sostenibilidad
            y el impacto ambiental.
        </p>

        <!-- Aquí se incorporarán las funcionalidades -->

    </main>

    <!-- Pie de página -->
    <footer>
        <p>© 2026 Colegio Bolívar | Bolivar Eco Calculator</p>
    </footer>

</body>
</html>
